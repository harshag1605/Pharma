spring:
  application:
    name: pharmacy-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pharma}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:8080}
app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
    access-token-minutes: 20
    refresh-token-days: 14
  storage:
    prescription-dir: ${PRESCRIPTION_DIR:./storage/prescriptions}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
